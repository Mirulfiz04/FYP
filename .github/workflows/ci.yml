# MEDS CI/CD pipeline (GitHub Actions)
#
# CI (Continuous Integration) - runs on every pull request AND every push to main:
#   1. flutter         -> analyze + all tests in test/
#   2. python          -> the training-script self-checks in training/test_*.py
#   3. edge-functions  -> type-checks the Supabase Edge Functions
#   The three run in parallel. If any fails, the PR shows a red X.
#
# CD (Continuous Delivery) - only after a push to main, and only if CI is green:
#   4. android-apk     -> builds the release APK, downloadable from the run page
#   5. deploy-functions-> deploys supabase/functions/* to the live Supabase project
#
# Results: GitHub repo -> "Actions" tab.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------- CI
  flutter:
    name: Flutter app (analyze + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Only real errors fail the build; lint hints are listed but don't block.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  python:
    name: Training scripts (self-checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # TensorFlow 2.15 has no 3.12+ build
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r requirements.txt
      # Each test is a plain script that asserts and prints "ok"; bash -e stops at the first failure.
      - run: for f in test_*.py; do echo "== $f"; python "$f"; done

  edge-functions:
    name: Supabase Edge Functions (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts

  # ---------------------------------------------------------------- CD
  android-apk:
    name: Build Android APK
    if: github.event_name == 'push'
    needs: [flutter, python, edge-functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # matches android/app/build.gradle.kts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # shortcut: signed with the debug key (android/app/build.gradle.kts), fine for demos; add a release keystore secret before a Play Store upload.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: meds-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-functions:
    name: Deploy Supabase Edge Functions
    if: github.event_name == 'push'
    needs: [flutter, python, edge-functions]
    runs-on: ubuntu-latest
    env:
      # Repo Settings -> Secrets and variables -> Actions. Never put the token in this file.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip if the deploy token isn't set up yet
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN secret missing - functions not deployed."
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # Deploys every folder in supabase/functions. Secrets like ANTHROPIC_API_KEY stay as they are.
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --yes --project-ref vcgbfnuopsiraxhgwtgb
